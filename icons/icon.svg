<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0073ea" />
      <stop offset="50%" stop-color="#00a3ff" />
      <stop offset="100%" stop-color="#00c875" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#003566" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Outline -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35" />

  <!-- Check-circle symbol with shadow -->
  <g filter="url(#shadow)">
    <!-- Circle -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <!-- Checkmark -->
    <path d="M 188 256 L 236 304 L 328 204" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Decorative Monday status dots (Small subtle accents) -->
  <circle cx="130" cy="130" r="14" fill="#ffcb00" />
  <circle cx="382" cy="130" r="14" fill="#ff5ac4" />
  <circle cx="382" cy="382" r="14" fill="#ffffff" opacity="0.8" />
</svg>

